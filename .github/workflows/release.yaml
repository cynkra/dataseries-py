name: Release

# Publishes to PyPI when a GitHub release is published.
#
# Uses PyPI trusted publishing (OIDC) — no API token is stored anywhere. This
# needs a one-time setup on pypi.org: Publishing -> add a trusted publisher for
# owner `cynkra`, repository `dataseries-py`, workflow `release.yaml`,
# environment `pypi`.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
