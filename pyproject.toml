[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataseries"
version = "1.0.0"
description = "Download open Swiss economic time series from dataseries.org into pandas"
readme = "README.md"
license = "MIT"
authors = [{ name = "Christoph Sax", email = "christoph.sax@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["pandas>=1.3"]
keywords = ["switzerland", "economics", "time-series", "open-data", "statistics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://dataseries.org"
Documentation = "https://dataseries.org/py/"
Repository = "https://github.com/cynkra/dataseries-py"
Issues = "https://github.com/cynkra/dataseries-py/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/dataseries"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that hit the live dataseries.org API"]
addopts = "-m 'not network'"
